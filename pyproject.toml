[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dance-mirror"
version = "0.2.0"
description = "PyQt6 3D dance mirror with YOLO pose comparison and cloud coaching"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "DanceMirror Team" }]
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "httpx>=0.27",
  "PyQt6>=6.10,<6.11",
  "PyQt6-Fluent-Widgets>=1.7",
  "PyQt6-WebEngine>=6.10,<6.11",
  "scipy>=1.13",
  "einops>=0.8",
]

[project.optional-dependencies]
vision = [
  "torch>=2.8",
  "torchvision>=0.23",
  "ultralytics>=8.4",
  "onnxruntime-gpu>=1.20",
]
multimodal = [
  "mediapipe>=0.10.18",
  "sounddevice>=0.5",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
dance-mirror = "dance_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dance_mirror = ["resources/*.js", "resources/*.glb", "resources/*.md", "resources/*/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = []
